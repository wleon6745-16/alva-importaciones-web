server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, text/plain y text/html se sirven sin charset explícito y algunos clientes
    # (o el estándar HTTP a secas) asumen ISO-8859-1, rompiendo acentos/ñ en robots.txt,
    # llms.txt y el propio HTML (detectado en SEO-015 al ver robots.txt con mojibake).
    charset utf-8;

    # Sitio estático: sin proxy /api en el MVP (la demo de chat es una
    # animación autocontenida, no llama al backend del asistente).
    # Si más adelante se embebe el chat real, agregar aquí un
    # location /api/ { proxy_pass http://<host-del-backend>:4000/api/; }
    # igual al patrón usado en ASISTENTE/frontend/nginx.conf.

    location / {
        try_files $uri $uri/ /404.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
