server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sitio estático: sin proxy /api en el MVP (la demo de chat es una
    # animación autocontenida, no llama al backend del asistente).
    # Si más adelante se embebe el chat real, agregar aquí un
    # location /api/ { proxy_pass http://<host-del-backend>:4000/api/; }
    # igual al patrón usado en ASISTENTE/frontend/nginx.conf.

    location / {
        try_files $uri $uri/ /404.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
