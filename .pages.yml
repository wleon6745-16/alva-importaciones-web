# Configuración de Pages CMS (https://pagescms.org) para administrar productos y promociones de
# Alva Importaciones sin tocar código. Este archivo por sí solo NO habilita nada: hace falta
# instalar la GitHub App de Pages CMS en este repositorio y conectar el repo desde
# app.pagescms.org (acción manual del dueño de la cuenta de GitHub — ver
# docs/CONTENT_WORKFLOW.md §6 y el reporte de la sesión CMS-1 para el paso a paso exacto).
#
# Espeja el schema real de src/content.config.ts — no se agregaron campos que el sitio no vaya a
# leer (destacado, disponible, galería, precio anterior, SEO title/description no existen todavía
# en el modelo real; ver el reporte de la sesión para el porqué no se inventaron aquí).
#
# HISTORIAL DE ESTE ARCHIVO (ver docs/seo-work/sessions/session-20.md, -21.md y -22.md):
#   - v1: una sola colección "products" con subfolders + un campo de imagen con
#     `options.path: "{fields.category}"`, esperando que Pages CMS interpolara esa plantilla.
#   - Confirmado en vivo (probado por el usuario) y luego confirmado leyendo el código fuente real
#     de Pages CMS (fields/core/image/edit-component.tsx en github.com/hunvreus/pagescms): NO
#     interpola. `options.path` se pasa literal a `normalizePath()` — sin ninguna función de
#     plantillas de por medio. La vista previa de una foto existente sale rota porque Pages CMS
#     resuelve la imagen concatenando directo `media.input` + el valor guardado, SIN buscar en
#     subcarpetas — y el valor guardado nunca incluye la categoría.
#   - v2 (esta versión): en vez de intentar que un solo campo elija dinámicamente entre carpetas,
#     se volvió a 4 colecciones de productos (una por categoría), cada una con su propia fuente de
#     medios de ruta FIJA — sin plantillas, sin interpolación, sin nada sin confirmar. Es el mismo
#     patrón que ya se había validado funcionando con Decap CMS (Sesión 19), solo con la sintaxis
#     real de Pages CMS. Cero cambios en los 74 JSON de producto ni en `imageFor()` — el campo
#     `image` sigue guardando solo el nombre de archivo, exactamente igual que antes.
#
# LIMITACIÓN CONOCIDA Y ACEPTADA (promociones): las promociones sí quedan en una sola colección
# (el orden de la sección en la home cruza las 4 categorías, así que partirla en 4 no tendría
# sentido) apuntando a una fuente de medios que cubre las 4 carpetas de categoría a la vez. Eso
# significa que la vista previa automática de la FOTO YA GUARDADA de una promoción puede seguir
# saliendo rota por la misma razón que los productos antes de este cambio — Pages CMS no sabe en
# cuál de las 4 carpetas buscar sin que alguien navegue. Con solo 4 promociones, editadas con poca
# frecuencia, se aceptó este límite en vez de inventar una solución sin confirmar. Si esto molesta
# en la práctica, la alternativa sería mover las promociones también a colecciones separadas por
# categoría (mismo patrón que productos) — no se hizo todavía porque no se pidió y complica el
# concepto de "orden" que hoy cruza las 4 categorías en una sola lista.

media:
  - name: muebles_photos
    label: "Fotos de muebles"
    input: src/assets/products/muebles
    output: ""
    extensions: [jpg, jpeg, png, webp]
  - name: unas_photos
    label: "Fotos de uñas"
    input: src/assets/products/unas
    output: ""
    extensions: [jpg, jpeg, png, webp]
  - name: capilares_photos
    label: "Fotos de capilares"
    input: src/assets/products/capilares
    output: ""
    extensions: [jpg, jpeg, png, webp]
  - name: maquillaje_photos
    label: "Fotos de maquillaje"
    input: src/assets/products/maquillaje
    output: ""
    extensions: [jpg, jpeg, png, webp]
  - name: all_product_photos
    label: "Fotos de productos y promociones (las 4 categorías, para navegar a mano)"
    input: src/assets/products
    output: ""
    extensions: [jpg, jpeg, png, webp]

content:
  - name: products-muebles
    label: "Productos — Muebles"
    label_singular: "Producto"
    type: collection
    path: src/content/products/muebles
    format: json
    view:
      fields: [name, price, code]
      primary: name
      sort: [name]
    fields:
      - name: slug
        label: "Slug (identifica la dirección web del producto)"
        type: string
        required: true
        description: >-
          No cambiar en un producto ya publicado — cambiarlo mueve la página a otra dirección y
          rompe cualquier enlace que ya esté compartido o indexado en Google.
      - name: name
        label: "Nombre"
        type: string
        required: true
      - name: category
        label: "Categoría"
        type: string
        hidden: true
        default: muebles
      - name: subcategory
        label: "Subcategoría"
        type: string
        required: false
      - name: code
        label: "Código de producto"
        type: string
        required: false
        description: >-
          Código interno del negocio. Cambiarlo solo si el producto real cambió de código — se
          usa para relacionarlo con el catálogo interno, no es un campo decorativo.
      - name: price
        label: "Precio (USD)"
        type: number
        required: false
      - name: brand
        label: "Marca"
        type: string
        required: false
      - name: features
        label: "Características"
        type: list
        required: false
        fields:
          - name: item
            label: "Característica"
            type: string
      - name: image
        label: "Foto principal"
        type: image
        required: true
        options:
          media: muebles_photos
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
        description: >-
          Describe la foto en una frase corta, para accesibilidad y buscadores — no repitas solo
          el nombre del producto.

