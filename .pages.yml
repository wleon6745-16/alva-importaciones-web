# Configuración de Pages CMS (https://pagescms.org) para administrar productos y promociones de
# Alva Importaciones sin tocar código. Este archivo por sí solo NO habilita nada: hace falta
# instalar la GitHub App de Pages CMS en este repositorio y conectar el repo desde
# app.pagescms.org (acción manual del dueño de la cuenta de GitHub — ver
# docs/CONTENT_WORKFLOW.md §6 y el reporte de la sesión CMS-1 para el paso a paso exacto).
#
# Espeja el schema real de src/content.config.ts — no se agregaron campos que el sitio no vaya a
# leer (destacado, disponible, galería, precio anterior, SEO title/description no existen todavía
# en el modelo real; ver el reporte de la sesión para el porqué no se inventaron aquí).
#
# PUNTOS SIN VERIFICAR EN VIVO (no se pudo probar Pages CMS de punta a punta porque instalar su
# GitHub App requiere una acción manual del dueño de la cuenta de GitHub — ver más abajo). Revisar
# esto en el primer login real antes de confiar el catálogo real a este archivo:
#   1. Si "output: ''" en la fuente de medios (abajo) guarda solo el nombre del archivo, tal como
#      necesita `imageFor()` en el código, o si guarda una ruta completa. Si guarda una ruta, hay
#      que ajustar `imageFor()` en los archivos que la definen (buscar "function imageFor" en
#      src/pages/ y src/components/) para quitar el prefijo antes de buscar la imagen — cambio de
#      una línea por archivo, no aplicado todavía porque no hay forma de confirmar cuál de los dos
#      casos es real sin haber iniciado sesión.
#   2. Si "subfolders: true" + el patrón de "filename" reparten un producto nuevo en
#      src/content/products/<categoría>/ automáticamente según el campo "category", o si hay que
#      elegir la subcarpeta a mano al crear cada producto.
#   3. Los tipos de campo "text" (párrafo simple) y "number" se usan abajo por ser el nombre más
#      común en este tipo de herramientas — no se pudo confirmar contra la referencia completa de
#      tipos de campo de Pages CMS.
#   4. No se encontró confirmación de que exista un modo "solo lectura" para un campo puntual. Por
#      eso "slug" y "code" no están técnicamente bloqueados, solo llevan una advertencia visible
#      (ver "description" de cada uno) — es la única protección que se pudo confirmar que existe.

media:
  - name: product_photos
    label: "Fotos de productos y promociones"
    input: src/assets/products
    output: ""
    subfolders: true
    extensions: [jpg, jpeg, png, webp]

content:
  - name: products
    label: "Productos"
    type: collection
    path: src/content/products
    format: json
    subfolders: true
    filename: "{fields.category}/{fields.slug}.json"
    view:
      fields: [name, category, price, code]
      primary: name
      sort: [category, name]
    fields:
      - name: slug
        label: "Slug (identifica la dirección web del producto)"
        type: string
        required: true
        description: >-
          No cambiar en un producto ya publicado — cambiarlo mueve la página a otra dirección y
          rompe cualquier enlace que ya esté compartido o indexado en Google.
      - name: name
        label: "Nombre"
        type: string
        required: true
      - name: category
        label: "Categoría"
        type: select
        required: true
        options:
          values: [muebles, unas, capilares, maquillaje]
      - name: subcategory
        label: "Subcategoría"
        type: string
        required: false
      - name: code
        label: "Código de producto"
        type: string
        required: false
        description: >-
          Código interno del negocio. Cambiarlo solo si el producto real cambió de código — se
          usa para relacionarlo con el catálogo interno, no es un campo decorativo.
      - name: price
        label: "Precio (USD)"
        type: number
        required: false
      - name: brand
        label: "Marca"
        type: string
        required: false
      - name: features
        label: "Características"
        type: list
        required: false
        fields:
          - name: item
            label: "Característica"
            type: string
      - name: image
        label: "Foto principal"
        type: image
        required: true
        media: product_photos
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
        description: >-
          Describe la foto en una frase corta, para accesibilidad y buscadores — no repitas solo
          el nombre del producto.

  - name: promos
    label: "Promociones"
    type: collection
    path: src/content/promos
    format: json
    filename: "{fields.order}-{fields.label}.json"
    view:
      fields: [label, order]
      primary: label
      sort: [order]
    fields:
      - name: label
        label: "Título"
        type: string
        required: true
      - name: body
        label: "Descripción"
        type: text
        required: true
      - name: imageCategory
        label: "Categoría de la foto"
        type: select
        required: true
        options:
          values: [muebles, unas, capilares, maquillaje]
      - name: image
        label: "Foto"
        type: image
        required: true
        media: product_photos
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
      - name: order
        label: "Orden (1 = primero)"
        type: number
        required: true
