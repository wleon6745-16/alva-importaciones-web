        label: "Descripción"
        type: text
        required: true
      - name: imageCategory
        label: "Categoría de la foto"
        type: select
        required: true
        options:
          values: [muebles, unas, capilares, maquillaje]
      - name: image
        label: "Foto"
        type: image
        required: true
        options:
          media: all_product_photos
        description: >-
          Si la vista previa de una foto ya guardada sale rota, es una limitación conocida (ver
          comentario al inicio de este archivo) — la foto sigue funcionando bien en el sitio.
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
      - name: order
        label: "Orden (1 = primero)"
        type: number
        required: true
