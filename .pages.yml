# Configuración de Pages CMS (https://pagescms.org) para administrar productos y promociones de
# Alva Importaciones sin tocar código. Este archivo por sí solo NO habilita nada: hace falta
# instalar la GitHub App de Pages CMS en este repositorio y conectar el repo desde
# app.pagescms.org (acción manual del dueño de la cuenta de GitHub — ver
# docs/CONTENT_WORKFLOW.md §6 y el reporte de la sesión CMS-1 para el paso a paso exacto).
#
# Espeja el schema real de src/content.config.ts — no se agregaron campos que el sitio no vaya a
# leer (destacado, disponible, galería, precio anterior, SEO title/description no existen todavía
# en el modelo real; ver el reporte de la sesión para el porqué no se inventaron aquí).
#
# NOTAS DE VERIFICACIÓN (actualizado tras conectar Pages CMS en vivo — ver
# docs/seo-work/sessions/session-21.md):
#
# Confirmado leyendo el código fuente de Pages CMS (types/field.ts, fields/core/image/*,
# lib/config-schema.ts en github.com/hunvreus/pagescms):
#   - "subfolders: true" en una colección SÍ existe y funciona (confirmado en vivo: el árbol de
#     "Productos" navega correctamente por categoría). NO es una clave válida en una fuente de
#     medios ("media:") — por eso no aparece más abajo.
#   - Un campo de imagen NO tiene una clave "media:" propia — la selección de fuente va anidada
#     en "options.media". Puesto directamente en el campo (como se hizo en la primera versión de
#     este archivo) se ignora en silencio.
#   - Pages CMS resuelve la imagen concatenando directo `media.input` + el valor guardado, SIN
#     buscar en subcarpetas — por eso la vista previa de fotos existentes salía rota: el campo
#     guarda solo el nombre de archivo ("butaca-francia.jpg"), pero el archivo real vive un nivel
#     más abajo (`src/assets/products/muebles/butaca-francia.jpg`). La fuente de medios usa ahora
#     "options.path: {fields.category}" en cada campo de imagen para completar ese nivel — el
#     mismo mecanismo de plantillas ({fields.x}) que ya funciona en "filename" de la colección.
#   - "readonly" sí existe como propiedad real de un campo (confirmado en types/field.ts) — no se
#     aplicó a "slug"/"code" a propósito: probablemente también bloquearía escribirlos al crear un
#     producto nuevo, lo cual sería peor que el riesgo que evita. La protección actual (texto de
#     advertencia visible) se mantiene.
#   - "text" (párrafo) y "number" sí son tipos de campo reales (confirmado en fields/core/).
#
# SIN CONFIRMAR TODAVÍA: que "options.path" en un campo de imagen acepte plantillas
# "{fields.category}" igual que "filename" a nivel de colección — es el mecanismo con más
# evidencia a favor que se encontró, pero no hay una prueba en vivo de esto específico todavía.
# Verificar recargando Pages CMS y abriendo un producto existente (p. ej. "Butaca Francia" en
# Muebles): si la foto se ve, funciona. Si sigue rota, avisar antes de seguir editando fotos desde
# el panel.

media:
  - name: product_photos
    label: "Fotos de productos y promociones"
    input: src/assets/products
    output: ""
    extensions: [jpg, jpeg, png, webp]

content:
  - name: products
    label: "Productos"
    type: collection
    path: src/content/products
    format: json
    subfolders: true
    filename: "{fields.category}/{fields.slug}.json"
    view:
      fields: [name, category, price, code]
      primary: name
      sort: [category, name]
    fields:
      - name: slug
        label: "Slug (identifica la dirección web del producto)"
        type: string
        required: true
        description: >-
          No cambiar en un producto ya publicado — cambiarlo mueve la página a otra dirección y
          rompe cualquier enlace que ya esté compartido o indexado en Google.
      - name: name
        label: "Nombre"
        type: string
        required: true
      - name: category
        label: "Categoría"
        type: select
        required: true
        options:
          values: [muebles, unas, capilares, maquillaje]
      - name: subcategory
        label: "Subcategoría"
        type: string
        required: false
      - name: code
        label: "Código de producto"
        type: string
        required: false
        description: >-
          Código interno del negocio. Cambiarlo solo si el producto real cambió de código — se
          usa para relacionarlo con el catálogo interno, no es un campo decorativo.
      - name: price
        label: "Precio (USD)"
        type: number
        required: false
      - name: brand
        label: "Marca"
        type: string
        required: false
      - name: features
        label: "Características"
        type: list
        required: false
        fields:
          - name: item
            label: "Característica"
            type: string
      - name: image
        label: "Foto principal"
        type: image
        required: true
        options:
          media: product_photos
          path: "{fields.category}"
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
        description: >-
          Describe la foto en una frase corta, para accesibilidad y buscadores — no repitas solo
          el nombre del producto.

  - name: promos
    label: "Promociones"
    type: collection
    path: src/content/promos
    format: json
    filename: "{fields.order}-{fields.label}.json"
    view:
      fields: [label, order]
      primary: label
      sort: [order]
    fields:
      - name: label
        label: "Título"
        type: string
        required: true
      - name: body
        label: "Descripción"
        type: text
        required: true
      - name: imageCategory
        label: "Categoría de la foto"
        type: select
        required: true
        options:
          values: [muebles, unas, capilares, maquillaje]
      - name: image
        label: "Foto"
        type: image
        required: true
        options:
          media: product_photos
          path: "{fields.imageCategory}"
      - name: imageAlt
        label: "Texto alternativo de la foto (ALT)"
        type: string
        required: true
      - name: order
        label: "Orden (1 = primero)"
        type: number
        required: true
