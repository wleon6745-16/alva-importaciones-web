  - name: promos
    label: "Promociones"
    label_singular: "Promoción"
    type: collection
    path: src/content/promos
    format: json
    filename: "{fields.order}-{fields.label}.json"
    view:
      fields: [label, order]
      primary: label
      sort: [order]
    fields:
